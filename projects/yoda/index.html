<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Yoda airport mobility and parking experience — UI/UX case study by Ajeet Kumar">
  <title>Yoda Airport Mobility Case Study | Ajeet Kumar</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/system.css">
  <style>
    /* Keep the complete artwork visible; never enlarge it to fill a fixed height. */
    body[data-page="yoda"] .yoda-hero.has-banner{
      display:grid;isolation:isolate;padding:0;background:#14213b!important;
    }
    .yoda-hero.has-banner .yoda-banner{
      grid-area:1 / 1;align-self:center;position:static;
      display:block;width:100%;height:auto;max-width:100%;
    }
    .yoda-hero.has-banner .yoda-hero-grid{
      grid-area:1 / 1;align-self:center;position:relative;z-index:1;
      display:block;width:90%;max-width:1728px;min-height:0;
      margin-inline:auto;padding-block:36px;
    }
    .yoda-hero.has-banner .yoda-hero-grid>div:first-child{
      width:38%;max-width:580px;padding:0;border-radius:0;background:none;
    }
    .yoda-hero.has-banner h1{
      font-size:clamp(38px,3.3vw,64px);line-height:1.08;
      letter-spacing:-.035em;margin:18px 0 24px;
    }
    .yoda-hero.has-banner h1 i{color:#b9d8ff;white-space:nowrap}
    .yoda-hero.has-banner .eyebrow{color:#b9d8ff;font-size:11px;letter-spacing:.12em}
    .yoda-hero.has-banner .eyebrow:before{background:#b9d8ff}
    .yoda-hero.has-banner .breadcrumbs{margin-bottom:24px;color:#d5deed;font-size:11px}
    .yoda-hero.has-banner p{font-size:clamp(14px,1vw,17px);line-height:1.7;margin:0;max-width:460px}
    .yoda-hero.has-banner .hero-actions{display:flex;flex-wrap:wrap;gap:18px 24px;margin-top:28px}
    .yoda-hero.has-banner .hero-actions .btn{padding:12px 18px;font-size:10px}
    .yoda-hero.has-banner .text-link{font-size:11px;color:#fff}
    @media(max-width:1199px){
      body[data-page="yoda"] .yoda-hero.has-banner{display:flex;flex-direction:column}
      .yoda-hero.has-banner .yoda-hero-grid{
        width:calc(100% - 48px);padding-block:48px;margin-inline:auto;
      }
      .yoda-hero.has-banner .yoda-hero-grid>div:first-child{width:100%;max-width:680px}
      .yoda-hero.has-banner h1{font-size:clamp(34px,5.5vw,58px)}
      .yoda-hero.has-banner p{max-width:600px}
      .yoda-hero.has-banner .yoda-banner{order:1;width:100%;height:auto}
    }
    @media(max-width:560px){
      .yoda-hero.has-banner .yoda-hero-grid{padding-block:36px}
      .yoda-hero.has-banner .hero-actions{align-items:flex-start;gap:18px}
      .yoda-hero.has-banner .breadcrumbs{margin-bottom:20px}
    }

    .yoda-case .yoda-section-lead{max-width:760px;font-size:17px;line-height:1.8}
    .yoda-case .yoda-wireframes{background:#f5f5f5}
    .yoda-wire-layout{display:grid;grid-template-columns:minmax(230px,.8fr) minmax(0,1.6fr);gap:clamp(32px,6vw,88px);align-items:start;margin-top:48px}
    .yoda-design-notes{position:sticky;top:88px}
    .yoda-design-notes article{padding:24px 0;border-top:1px solid #d8dce2}
    .yoda-design-notes article span{font-size:10px;font-weight:700;letter-spacing:.1em;color:#666b75}
    .yoda-design-notes h3,.yoda-experience-notes h3{font-size:24px;line-height:1.25;margin:12px 0}
    .yoda-design-notes p{margin:0;line-height:1.8}
    .yoda-design-notes .text-link{display:inline-block;margin-top:24px;color:#4936a0}
    .yoda-wire-showcase{margin:0;min-width:0}
    .yoda-wire-showcase img,.yoda-app-showcase img{display:block;width:100%;max-width:100%;height:auto}
    .yoda-wire-showcase img{border:1px solid #e1e3e6;border-radius:12px}
    .yoda-wire-showcase figcaption{margin-top:16px;font-size:12px;color:#666b75}
    .yoda-case .yoda-experience{background:linear-gradient(135deg,#557cec 0%,#719af4 55%,#4d73db 100%);color:#101c40}
    .yoda-experience .eyebrow{color:#14285b}
    .yoda-experience .eyebrow:before{background:#14285b}
    .yoda-experience .case-intro-grid{align-items:center;gap:48px}
    .yoda-experience .case-intro-grid p,.yoda-experience-notes p{color:#14254e;font-size:16px;line-height:1.8}
    .yoda-app-showcase{margin:48px 0 0}
    .yoda-app-showcase img{border-radius:16px}
    .yoda-experience-notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin-top:36px}
    .yoda-experience-notes article{border-top:1px solid #20397655;padding-top:16px}
    .yoda-experience-notes h3{font-size:22px}
    .yoda-experience-notes p{font-size:14px;margin-bottom:0}
    @media(max-width:900px){
      .yoda-wire-layout{grid-template-columns:1fr}
      .yoda-design-notes{position:static}
      .yoda-wire-showcase{width:100%;max-width:720px;margin-inline:auto}
      .yoda-experience .case-intro-grid{gap:16px}
      .yoda-experience-notes{grid-template-columns:1fr;gap:20px}
    }
  </style>
</head>
<body data-page="yoda">
  <div id="app"></div>
  <script>window.SITE_ROOT="../..";</script>
  <script src="../../assets/js/site.js"></script>
  <script>
    (function () {
      var hero = document.querySelector('.yoda-hero');
      if (!hero) return;
      var banner = new Image();
      banner.className = 'yoda-banner';
      banner.alt = 'Yoda airport mobility app multi-screen mockup';
      banner.fetchPriority = 'high';
      banner.onload = function () {
        var screens = hero.querySelector('.xd-hero-screens');
        if (screens) screens.remove();
        hero.prepend(banner);
        hero.classList.add('has-banner');
      };
      banner.src = '../../assets/images/yoda/yoda-banner.png';
    })();
  </script>
  <script src="../../assets/js/shell.js"></script>
</body>
</html>
