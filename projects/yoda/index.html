<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Yoda airport mobility and parking experience — UI/UX case study by Ajeet Kumar">
  <title>Yoda Airport Mobility Case Study | Ajeet Kumar</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/system.css">
  <style>
    /* Activate the banner layout only after the image loads successfully. */
    .yoda-hero.has-banner{padding:0}
    .yoda-hero.has-banner .yoda-hero-grid{
      position:relative;z-index:1;min-height:650px;padding-block:56px;
    }
    .yoda-hero.has-banner .yoda-banner{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;
    }
    .yoda-hero.has-banner .yoda-hero-grid>div:first-child{
      max-width:580px;padding:24px;border-radius:20px;
      background:linear-gradient(90deg,rgba(13,23,39,.9),rgba(13,23,39,.65));
    }
    .yoda-hero.has-banner h1{font-size:clamp(52px,5.4vw,84px)}
    .yoda-hero.has-banner .breadcrumbs{margin-bottom:28px}
    @media(max-width:900px){
      .yoda-hero.has-banner{display:flex;flex-direction:column}
      .yoda-hero.has-banner .yoda-hero-grid{min-height:0;padding-block:40px}
      .yoda-hero.has-banner .yoda-hero-grid>div:first-child{
        max-width:100%;padding:0;background:none;
      }
      .yoda-hero.has-banner .yoda-banner{
        position:static;order:1;height:auto;object-fit:contain;
      }
    }
  </style>
</head>
<body data-page="yoda">
  <div id="app"></div>
  <script>window.SITE_ROOT="../..";</script>
  <script src="../../assets/js/site.js"></script>
  <script>
    (function () {
      var hero = document.querySelector('.yoda-hero');
      if (!hero) return;
      var banner = new Image();
      banner.className = 'yoda-banner';
      banner.alt = 'Yoda airport mobility app multi-screen mockup';
      banner.fetchPriority = 'high';
      banner.onload = function () {
        var screens = hero.querySelector('.xd-hero-screens');
        if (screens) screens.remove();
        hero.prepend(banner);
        hero.classList.add('has-banner');
      };
      banner.src = '../../assets/images/yoda/yoda-banner.png';
    })();
  </script>
  <script src="../../assets/js/shell.js"></script>
</body>
</html>
